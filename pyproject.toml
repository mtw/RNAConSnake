[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaconsnake"
version = "0.2.0"
description = "Workflow for discovering and prioritizing locally conserved RNA secondary structure candidates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GNU Affero General Public License v3 or later (AGPL-3.0-or-later)"}
authors = [
  {name = "Michael T. Wolfinger"},
]
dependencies = [
  "snakemake>=8,<10",
  "tqdm>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
rnaconsnake-run = "rnaconsnake.cli:main"
rnaconsnake-split-stockholm = "rnaconsnake.tools.split_stockholm:main"
rnaconsnake-remove-gaponly = "rnaconsnake.tools.remove_gaponly:main"
rnaconsnake-strip-aln = "rnaconsnake.tools.strip_aln:main"
rnaconsnake-alifold-maxcovar = "rnaconsnake.tools.alifold_maxcovar:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rnaconsnake = ["workflow/snakefile", "workflow/config.yaml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
