[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaconsnake"
version = "0.3.0"
description = "Workflow for discovering and prioritizing locally conserved RNA secondary structure candidates"
readme = "README.md"
# snakemake 8 requires 3.11; a lower floor here is a promise nothing can keep.
requires-python = ">=3.11"
license = {text = "GNU Affero General Public License v3 or later (AGPL-3.0-or-later)"}
authors = [
  {name = "Michael T. Wolfinger"},
]
dependencies = [
  "snakemake>=8,<10",
  "tqdm>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  # Pinned to a minor series: the formatter's output can change between them,
  # and CI checks formatting.
  "ruff>=0.16,<0.17",
  # The workflow tests run the refold leg, which imports RNA. Not a runtime
  # dependency of the package: a real run takes its ViennaRNA -- module and
  # binaries together -- from conda or the container, so that one install
  # provides both. 2.7 is both the version the configuration was locked
  # against and the oldest PyPI publishes wheels for.
  "ViennaRNA>=2.7,<3",
]

[project.scripts]
RNAcs = "rnaconsnake.cli:main"
rnaconsnake-run = "rnaconsnake.cli:main"
rnaconsnake-split-stockholm = "rnaconsnake.tools.split_stockholm:main"
rnaconsnake-remove-gaponly = "rnaconsnake.tools.remove_gaponly:main"
rnaconsnake-strip-aln = "rnaconsnake.tools.strip_aln:main"
rnaconsnake-alifold-maxcovar = "rnaconsnake.tools.alifold_maxcovar:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rnaconsnake = [
  "workflow/snakefile",
  "workflow/config.yaml",
  "resources/benchmark/*",
]

[tool.ruff]
# The codebase is written to ~110 columns; 88 would reflow prose-heavy
# docstrings and comments that read better as they are. Python version comes
# from project.requires-python.
line-length = 110

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import order
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplifications
  "RUF",  # ruff's own checks
  "PIE",  # misc lints
  "PERF",  # obvious performance mistakes
  "PT",   # pytest style
  "RET",  # return-statement shape
  "N",    # naming
  "PGH",  # blanket noqa/type-ignore
  "FURB",  # modern idioms
  "TID",  # tidy imports
  "C90",  # cyclomatic complexity, capped below
]
ignore = [
  # Both sites it flags here fold a multi-line if/else into a ~110-column
  # ternary, which is shorter but not clearer.
  "SIM108",
  # Where a loop body is one expression, ruff already rewrote it. What is
  # left builds multi-line rows, and reads better as a loop.
  "PERF401",
]

[tool.ruff.lint.mccabe]
# Today's worst function. The ceiling is a ratchet: nothing new may exceed
# what the orchestration entry points already cost.
max-complexity = 23

[tool.ruff.lint.per-file-ignores]
# pytest rules are about tests; asserts in the library are not test asserts.
"src/*" = ["PT"]
"setup.py" = ["PT"]
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
