name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor declared in pyproject, the versions in between, and the one
        # development happens on. A floor nothing builds against is a guess.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest -v

      - name: Check CLI version
        run: |
          . .venv/bin/activate
          RNAcs --version

      - name: Check deprecated alias still works
        run: |
          . .venv/bin/activate
          rnaconsnake-run --version

      - name: Check tool-path diagnostic
        run: |
          . .venv/bin/activate
          RNAcs --show-tool-paths

      - name: Check dependency reporting
        run: |
          . .venv/bin/activate
          if RNAcs --check-deps; then
            echo "Expected missing RNALalifold in CI"
            exit 1
          fi

  package-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
        dist-type: ["sdist", "wheel"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install from built distribution
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          if [ "${{ matrix.dist-type }}" = "sdist" ]; then
            pip install dist/*.tar.gz
          else
            pip install dist/*.whl
          fi

      - name: Smoke test installed CLI
        run: |
          . .venv/bin/activate
          RNAcs --version

      - name: Smoke test installed tool-path diagnostic
        run: |
          . .venv/bin/activate
          RNAcs --show-tool-paths

      - name: Check dependency reporting from installed CLI
        run: |
          . .venv/bin/activate
          if RNAcs --check-deps; then
            echo "Expected missing RNALalifold in CI"
            exit 1
          fi

      # A file present in the repository but missing from the built
      # distribution is invisible to every other check here.
      - name: Check the installed package carries the workflow and its resources
        run: |
          . .venv/bin/activate
          python - <<'EOF'
          import sys
          from importlib.resources import files
          from pathlib import Path

          root = files("rnaconsnake")
          missing = [
              name
              for name in ("workflow/snakefile", "workflow/config.yaml")
              if not root.joinpath(name).is_file()
          ]
          packaged = {p.name for p in Path(str(root.joinpath("resources/benchmark"))).glob("*")}
          for truth in Path("resources/benchmark").glob("*.tsv"):
              if truth.name not in packaged:
                  missing.append(f"resources/benchmark/{truth.name}")
          if missing:
              sys.exit("missing from the installed package: " + ", ".join(missing))
          print("installed package carries:", sorted(packaged))
          EOF
