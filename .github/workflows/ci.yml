name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installed from the dev extra so the ruff version is pinned in one place.
      - name: Install package
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Check formatting
        run: |
          . .venv/bin/activate
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor declared in pyproject, the version in between, and the one
        # development happens on. A floor nothing builds against is a guess.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest -v

      - name: Check CLI version
        run: |
          . .venv/bin/activate
          RNAcs --version

      - name: Check deprecated alias still works
        run: |
          . .venv/bin/activate
          rnaconsnake-run --version

      - name: Check tool-path diagnostic
        run: |
          . .venv/bin/activate
          RNAcs --show-tool-paths

      - name: Check dependency reporting
        run: |
          . .venv/bin/activate
          if RNAcs --check-deps; then
            echo "Expected missing RNALalifold in CI"
            exit 1
          fi

  container-integration:
    # The only tier that runs the *real* toolchain. Every other test in this
    # repository stubs RNALalifold, RNAz and AlifoldZ, so a change in what those
    # tools print is invisible to them -- and parsing that output is where this
    # pipeline has historically broken.
    #
    # Skipped on pull_request: it builds an image and folds real RNA, so it
    # costs minutes rather than seconds. Run it by hand from the Actions tab.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Neither is on a package index, which is the whole reason the container
      # exists. alifoldz.pl comes from upstream RNAz and prepare-context.sh
      # applies the repository's own patch to it, so this tier runs the same
      # script the shipped image does.
      # SISSIz is pinned to a release tag rather than tracking the default
      # branch: it cannot be seeded, so the build that simulates the null
      # alignments is part of what a calibration is reproducible against.
      # Keep in step with SISSIZ_VERSION in src/rnaconsnake/cli.py.
      - name: Fetch the sources conda cannot supply
        run: |
          git clone --depth 1 --branch 0.2.0 \
            https://github.com/mtw/SISSIz "$RUNNER_TEMP/SISSIz"
          curl -fsSL -o "$RUNNER_TEMP/alifoldz.pl" \
            https://raw.githubusercontent.com/ViennaRNA/RNAz/master/perl/alifoldz.pl

      - name: Prepare the build context
        run: |
          SISSIZ_SRC="$RUNNER_TEMP/SISSIz" ALIFOLDZ="$RUNNER_TEMP/alifoldz.pl" \
            ./container/prepare-context.sh

      - name: Build the image
        run: docker build -t rnacs:ci container

      # Inside the image this must pass, including the check that the ViennaRNA
      # binaries and the Python module are one build.
      - name: Check the toolchain the image ships
        run: docker run --rm rnacs:ci --check-deps

      # No --user: the image runs as root, and an arbitrary uid has no passwd
      # entry, which snakemake needs.
      - name: Screen the JEV 3'UTR example through the real toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/run"
          docker run --rm \
            -v "$PWD/examples:/data:ro" \
            -v "$RUNNER_TEMP/run:/work" \
            rnacs:ci \
            --input-alignment /data/all_JEVG_3UTR.relabel.stk \
            --output-dir /work \
            --maxbpspan 100 --cores 2 --no-progress \
            -- --config do_png=False

      - name: The run produced real results, not empty ones
        run: |
          python3 - "$RUNNER_TEMP/run" <<'EOF'
          import csv
          import re
          import sys
          from pathlib import Path

          run = Path(sys.argv[1])
          summary = run / "generated_files" / "summary" / "len_100"
          rows = list(csv.DictReader((summary / "RNAConSnake.log.csv").open()))
          if not rows:
              sys.exit("the screen reported no candidates at all")
          print(f"{len(rows)} windows reported")

          # Stubs cannot produce these: they are what the real tools computed.
          scored = [r for r in rows if r["alifoldzscore"] not in ("", "NA")]
          if not scored:
              sys.exit("every AlifoldZ score is NA: the real tool never produced one")
          probs = [r for r in rows if r["rnazprob"] not in ("", "NA")]
          if not probs:
              sys.exit("every RNAz probability is missing")
          print(f"{len(scored)} AlifoldZ scores, {len(probs)} RNAz probabilities")

          for required in ["RNAConSnake.nr.csv", "RNAConSnake.md", "RNAConSnake.log"]:
              if not (summary / required).is_file():
                  sys.exit(f"missing {required}")
          if not (run / "generated_files" / "alignment_screenability.tsv").is_file():
              sys.exit("missing the screenability report")

          # The refold leg runs through the ViennaRNA Python bindings now, so
          # this is where a bindings/binaries problem would surface.
          refolded = sorted((run / "generated_files" / "refold" / "len_100").glob("*_refold.out"))
          if not refolded:
              sys.exit("the refold leg produced nothing")
          record = re.compile(r"^> \S+\n[ACGUNacgun]+\n[().]+ \( *-?\d+\.\d\d\)$", re.M)
          for path in refolded:
              if not record.search(path.read_text()):
                  sys.exit(f"{path.name} does not look like a constrained fold")
          print(f"{len(refolded)} refolded candidates")
          EOF

      # Every other tier stubs RNAz, so the fake prints whatever the test
      # expects and a wrong field mapping is invisible by construction. That is
      # how `consensus_mfe` came to hold RNAz's *mean single sequence* MFE: both
      # labels sat in one regex alternation, and RNAz prints that one first.
      # Here the real tool's own output is still on disk next to what we parsed
      # out of it, so the two can simply be compared.
      - name: The parsed metrics are the numbers RNAz actually printed
        run: |
          python3 - "$RUNNER_TEMP/run" <<'EOF'
          import csv
          import json
          import re
          import sys
          from pathlib import Path

          run = Path(sys.argv[1])
          rows = {
              r["wbn"]: r
              for r in csv.DictReader(
                  (run / "generated_files" / "summary" / "len_100" / "RNAConSnake.log.csv").open()
              )
          }

          def printed(text, label):
              """The number RNAz wrote after `label`, read off its own output."""
              match = re.search(rf"^\s*{re.escape(label)}:\s*(-?\d+(?:\.\d+)?)\s*$", text, re.M)
              return match.group(1) if match else None

          checked = 0
          for report in sorted((run / "generated_files" / "rnaz" / "len_100").glob("*.rnaz.txt")):
              candidate = report.name[: -len(".rnaz.txt")]
              row = rows.get(candidate)
              if row is None:
                  sys.exit(f"{candidate} has RNAz output but no summary row")
              text = report.read_text()
              expected = {
                  "consensus_mfe": printed(text, "Consensus MFE"),
                  "sci": printed(text, "Structure conservation index"),
                  "rnazprob": printed(text, "SVM RNA-class probability"),
              }
              if expected["consensus_mfe"] is None:
                  continue  # RNAz scored nothing for this window
              # The trap this exists for: these two are different quantities.
              decoy = printed(text, "Mean single sequence MFE")
              for field, want in expected.items():
                  if want is None:
                      continue
                  got = row[field]
                  if float(got) != float(want):
                      sys.exit(
                          f"{candidate}: {field} is {got}, RNAz printed {want}"
                          + (
                              f" (it matches 'Mean single sequence MFE' = {decoy}: "
                              "the wrong field is being read)"
                              if decoy is not None and float(got) == float(decoy)
                              else ""
                          )
                      )
              checked += 1

          if not checked:
              sys.exit("no RNAz report carried a Consensus MFE: nothing was actually verified")
          print(f"{checked} candidates: consensus_mfe, sci and rnazprob match RNAz's own output")
          EOF

  package-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
        dist-type: ["sdist", "wheel"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install from built distribution
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          if [ "${{ matrix.dist-type }}" = "sdist" ]; then
            pip install dist/*.tar.gz
          else
            pip install dist/*.whl
          fi

      - name: Smoke test installed CLI
        run: |
          . .venv/bin/activate
          RNAcs --version

      - name: Smoke test installed tool-path diagnostic
        run: |
          . .venv/bin/activate
          RNAcs --show-tool-paths

      - name: Check dependency reporting from installed CLI
        run: |
          . .venv/bin/activate
          if RNAcs --check-deps; then
            echo "Expected missing RNALalifold in CI"
            exit 1
          fi

      # A file present in the repository but missing from the built
      # distribution is invisible to every other check here.
      - name: Check the installed package carries the workflow and its resources
        run: |
          . .venv/bin/activate
          python - <<'EOF'
          import sys
          from importlib.resources import files
          from pathlib import Path

          root = files("rnaconsnake")
          missing = [
              name
              for name in ("workflow/snakefile", "workflow/config.yaml")
              if not root.joinpath(name).is_file()
          ]
          packaged = {p.name for p in Path(str(root.joinpath("resources/benchmark"))).glob("*")}
          for truth in Path("resources/benchmark").glob("*.tsv"):
              if truth.name not in packaged:
                  missing.append(f"resources/benchmark/{truth.name}")
          if missing:
              sys.exit("missing from the installed package: " + ", ".join(missing))
          print("installed package carries:", sorted(packaged))
          EOF
