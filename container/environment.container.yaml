# Conda dependencies available for linux-aarch64.
#
# NOT here, because they are absent from bioconda entirely and are installed
# separately in the Dockerfile:
#   SISSIz 0.2.0  - built from source (null-model generator; the arm needs it)
#   alifoldz.pl   - RNAz ships it in the source tarball, not in the conda package
#   ps2eps        - Debian package
#   epstopdf      - Debian texlive
name: rnacs
channels: [conda-forge, bioconda]
dependencies:
  - python=3.12
  - snakemake>=8,<10
  - tqdm>=4,<5
  - pyyaml
  # Refolding imports the ViennaRNA Python module rather than calling
  # RNAfold, so this package must provide RNA for the env's python.
  - viennarna=2.7.2
  - rnaz=2.1
  - infernal=1.1.5
  # Optional (do_rscape). The bioconda package is named 'rscape', not
  # 'r-scape'; 2.0.4.a is the only version with a linux-aarch64 build.
  - rscape=2.0.4.a
  - hmmer            # provides esl-reformat
  - perl
  - imagemagick
  - pip
